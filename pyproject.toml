[project]
name = "backtest"
version = "0.1.0"
description = "Strategy-agnostic backtesting engine."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "numba>=0.58",
    "joblib>=1.3",
    "bottleneck>=1.3",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
viz = ["matplotlib>=3.7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backtest*"]
